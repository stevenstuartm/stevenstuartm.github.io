<header class="site-header">
    <div class="container">
        <div class="header-content">
            <h1 class="site-title">
                <a href="{{ '/' | relative_url }}" aria-label="Steven Stuart - Home">
                    <img src="{{ '/assets/img/favicon-64x64.png' | relative_url }}" alt="Steven Stuart logo" class="site-icon">
                </a>
            </h1>
            <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="header-right">
                <nav class="site-nav">
                    <a href="{{ '/about.html' | relative_url }}">About</a>
                    <a href="{{ '/resume.html' | relative_url }}">Resume</a>
                    <a href="{{ '/philosophy.html' | relative_url }}">Software Philosophy</a>
                    <a href="{{ '/study-routine.html' | relative_url }}">Study Routine</a>
                </nav>
                <div class="header-social">
                    {% include social-links.html modifier="-header" %}
                </div>
            </div>
        </div>
    </div>
</header>

<script>
    (function() {
        const hamburger = document.querySelector('.hamburger');
        const headerRight = document.querySelector('.header-right');

        hamburger.addEventListener('click', function() {
            const isExpanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', !isExpanded);
            this.classList.toggle('active');
            headerRight.classList.toggle('active');
        });

        document.querySelectorAll('.site-nav a').forEach(function(link) {
            link.addEventListener('click', function() {
                hamburger.classList.remove('active');
                headerRight.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
            });
        });

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.header-content')) {
                hamburger.classList.remove('active');
                headerRight.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
            }
        });
    })();
</script>
